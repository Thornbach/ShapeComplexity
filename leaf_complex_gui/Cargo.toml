[package]
name = "leaf_complex_gui"
version = "2.0.0"
edition = "2021"
authors = ["Tobias Trauden <ToTrauden@proton.me>"]
description = "Interactive GUI for ShapeComplexity: edge amount (EA) and macro-shape complexity (MC)"
license = "MIT"
repository = "https://github.com/Thornbach/ShapeComplexity"

[dependencies]
# Backend library (backend crate lives in the parent directory)
shapecomplexity = { path = ".." }

# GUI framework
eframe = "0.29"
egui = "0.29"
egui_plot = "0.29"

# File dialogs
rfd = "0.15"

# Image handling (same as backend)
image = "0.24.7"

# System info
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# For faster compile times during development
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native windowing
