[package]
name = "shapecomplexity"
version = "2.0.0"
edition = "2021"
authors = ["Tobias Trauden <ToTrauden@proton.me>"]
description = "Edge amount (EA) and macro-shape complexity (MC) of leaf outlines and other biological shapes from images"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Thornbach/ShapeComplexity"
homepage = "https://github.com/Thornbach/ShapeComplexity"
keywords = ["morphometrics", "leaf", "shape", "ecology", "image"]
categories = ["science", "command-line-utilities"]
# test data of the Python reference (23 MB); the tests skip when it is missing
exclude = ["tests/fixtures", "leaf_complex_gui"]

# Library target, also used by the GUI crate (leaf_complex_gui)
[lib]
name = "shapecomplexity"

[[bin]]
name = "shapecomplexity_cli"
path = "src/main.rs"

[dependencies]
# PNG/JPEG/TIFF/BMP decoding only; every image-processing step is own code (src/v2)
image = "0.24.7"

# CLI parsing
clap = { version = "4.4", features = ["derive"] }

# Parallel batch processing
rayon = "1.8"

[profile.release]
opt-level = 3
codegen-units = 1

# the tests run the whole pipeline on hundreds of masks
[profile.test]
opt-level = 3
